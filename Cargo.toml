[package]
name = "android_transcribe_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
cpal = "0.15"
log = "0.4"
android_logger = "0.13"
anyhow = "1.0"
transcribe-cpp = "0.1.3"
jni = "0.21"
libc = "0.2"
once_cell = "1.19"
crossbeam-channel = "0.5"
ferrous-opencc = { version = "=0.4.0", default-features = false, features = ["s2t-conversion", "t2s-conversion"] }
