name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (defaults to v<versionName> or push tag)'
        required: false
        default: ''

jobs:
  build:
    name: Build & Publish Signed Release (No Model)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Fix gradle.properties for CI
        run: |
          # Remove local JDK path override so Gradle uses JAVA_HOME from setup-java
          sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Install Android NDK
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install CMake & Ninja
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build

      - name: Install cargo-ndk
        run: which cargo-ndk || cargo install cargo-ndk

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 repository secret is not configured" >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore

      - name: Build signed release APK (Without Embedded Model)
        env:
          STORE_PASS: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for name in STORE_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!name}" ]; then
              echo "Release signing secret for $name is not configured" >&2
              exit 1
            fi
          done
          ./gradlew assembleRelease -PembedModel=false

      - name: Determine Version and Tag
        id: vars
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | grep -oP '"[^"]*"' | tr -d '"')
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              TAG="${GITHUB_REF#refs/tags/}"
            else
              TAG="v${VERSION_NAME}"
            fi
          fi
          echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "Detected version: ${VERSION_NAME}, Release tag: ${TAG}"

      - name: Package Release APK
        run: |
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="android-transcribe-app-${{ env.TAG_NAME }}-release-no-model.apk"
          cp "${APK_SRC}" "${APK_NAME}"
          echo "APK_FILE=${APK_NAME}" >> $GITHUB_ENV
          ls -lh "${APK_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_FILE }}
          path: ${{ env.APK_FILE }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Release ${{ env.TAG_NAME }}
          body: |
            Offline Voice Input Android App (signed release build without embedded speech model).

            - **APK**: `${{ env.APK_FILE }}`
            - **Model**: This build excludes the large 463MB embedded model. Speech models (GGUF / Whisper bin) can be imported or selected via in-app Model Settings.
          files: |
            ${{ env.APK_FILE }}
          draft: false
          prerelease: false
